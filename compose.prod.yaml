services:
  # Frontend Production Build
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
    restart: unless-stopped

  react-prod:
    build:
      context: .
      dockerfile: docker/react/Dockerfile.prod
    ports:
      - "${REACT_PORT:-3001}:80"
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80

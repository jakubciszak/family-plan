services:
  database:
    image: postgres:16-alpine
    container_name: family-plan-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - database_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - family-plan-dev-network

  app:
    image: ghcr.io/jakubciszak/family-plan-app:${IMAGE_TAG:-dev}
    container_name: family-plan-dev-app
    restart: unless-stopped
    working_dir: /app
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_SECRET: ${APP_SECRET:-CHANGE_ME}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8
      SERVER_NAME: ":80"
      FRANKENPHP_NUM_WORKERS: ${FRANKENPHP_NUM_WORKERS:-1}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@familyplan.local}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-Super Admin}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-CHANGE_ME}
      REQUIRE_EMAIL_ACTIVATION: ${REQUIRE_EMAIL_ACTIVATION:-false}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MAILER_FROM_EMAIL: ${MAILER_FROM_EMAIL:-noreply@familyplan.local}
      MAILER_FROM_NAME: ${MAILER_FROM_NAME:-Family Plan (dev)}
      APP_URL: ${APP_URL:-https://dev.family-plan.srv1201847.hstgr.cloud}
      FRONTEND_URL: ${FRONTEND_URL:-https://dev.family-plan.srv1201847.hstgr.cloud}
      DEFAULT_TEAM_NAME: ${DEFAULT_TEAM_NAME:-Moja rodzina}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:noreply@familyplan.local}
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default?auto_setup=1}
      TZ: ${TZ:-Europe/Warsaw}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - family-plan-dev-network
      - proxy-net

  worker:
    image: ghcr.io/jakubciszak/family-plan-app:${IMAGE_TAG:-dev}
    container_name: family-plan-dev-worker
    restart: unless-stopped
    working_dir: /app
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=128M"]
    environment: &dev_app_environment
      APP_ENV: ${APP_ENV:-prod}
      APP_SECRET: ${APP_SECRET:-CHANGE_ME}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default?auto_setup=1}
      RUN_MIGRATIONS: "false"
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MAILER_FROM_EMAIL: ${MAILER_FROM_EMAIL:-noreply@familyplan.local}
      MAILER_FROM_NAME: ${MAILER_FROM_NAME:-Family Plan (dev)}
      APP_URL: ${APP_URL:-https://dev.family-plan.srv1201847.hstgr.cloud}
      FRONTEND_URL: ${FRONTEND_URL:-https://dev.family-plan.srv1201847.hstgr.cloud}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:noreply@familyplan.local}
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
      TZ: ${TZ:-Europe/Warsaw}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - family-plan-dev-network

  cron:
    image: ghcr.io/jakubciszak/family-plan-app:${IMAGE_TAG:-dev}
    container_name: family-plan-dev-cron
    restart: unless-stopped
    working_dir: /app
    command: ["/usr/local/bin/streak-warnings.sh"]
    environment:
      <<: *dev_app_environment
      STREAK_WARNING_HOUR: ${STREAK_WARNING_HOUR:-18:00}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - family-plan-dev-network

  timetable-sync:
    image: ghcr.io/jakubciszak/family-plan-app:${IMAGE_TAG:-dev}
    container_name: family-plan-dev-timetable-sync
    restart: unless-stopped
    working_dir: /app
    command: ["/usr/local/bin/school-timetable-sync.sh"]
    environment:
      <<: *dev_app_environment
      SCHOOL_TIMETABLE_SYNC_INTERVAL: ${SCHOOL_TIMETABLE_SYNC_INTERVAL:-3600}
      SCHOOL_TIMETABLE_SYNC_WEEKS: ${SCHOOL_TIMETABLE_SYNC_WEEKS:-2}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - family-plan-dev-network

volumes:
  database_data_dev:
    driver: local

networks:
  family-plan-dev-network:
    driver: bridge
  proxy-net:
    external: true
    name: proxy-net

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/**/Domain/Entity/'
            - '../src/**/Domain/ValueObject/'
            - '../src/**/Domain/Event/'
            - '../src/**/Application/Command/'

    # Repository implementations
    App\UserManagement\Domain\Repository\UserRepositoryInterface:
        class: App\UserManagement\Infrastructure\Persistence\DoctrineUserRepository

    App\TaskManagement\Domain\Repository\TaskRepositoryInterface:
        class: App\TaskManagement\Infrastructure\Persistence\DoctrineTaskRepository

    App\TaskManagement\Domain\Repository\TaskTemplateRepositoryInterface:
        class: App\TaskManagement\Infrastructure\Persistence\DoctrineTaskTemplateRepository

    App\TaskManagement\Domain\Repository\TaskExecutionRepositoryInterface:
        class: App\TaskManagement\Infrastructure\Persistence\DoctrineTaskExecutionRepository

    App\PointsManagement\Domain\Repository\UserWalletRepositoryInterface:
        class: App\PointsManagement\Infrastructure\Persistence\DoctrineUserWalletRepository

    App\TaskManagement\Domain\Repository\BonusPointsRuleRepositoryInterface:
        class: App\TaskManagement\Infrastructure\Persistence\DoctrineBonusPointsRuleRepository

    # Policy implementations
    App\TaskManagement\Domain\Policy\TaskApprovalPolicyInterface:
        class: App\TaskManagement\Domain\Policy\AdminApprovalPolicy

    # Strategy implementations
    App\TaskManagement\Domain\Strategy\PointsAwardStrategyInterface:
        class: App\TaskManagement\Domain\Strategy\TaskApprovalPointsAwardStrategy

    App\TaskManagement\Domain\Strategy\ExecutionPointsAwardStrategyInterface:
        class: App\TaskManagement\Domain\Strategy\ExecutionApprovalPointsAwardStrategy

    # Clock implementation
    App\Shared\Domain\Clock\ClockInterface:
        class: App\Shared\Infrastructure\Clock\SystemClock

    # Message buses - bind specific buses to controller parameters
    App\Presentation\Api\TaskApiController:
        arguments:
            $commandBus: '@command.bus'
            $queryBus: '@query.bus'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones


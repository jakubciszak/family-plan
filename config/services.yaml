# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.allowance_currency: '%env(ALLOWANCE_CURRENCY)%'
    school_timetable_zone: 'Europe/Warsaw'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/**/Domain/Entity/'
            - '../src/**/Domain/ValueObject/'
            - '../src/**/Domain/Event/'
            - '../src/**/Application/Command/'

    App\TeamManagement\Application\Service\InvitationLinkGenerator:
        arguments:
            $frontendUrl: '%env(FRONTEND_URL)%'

    App\TeamManagement\Application\Service\DefaultTeamProvisioner:
        arguments:
            $defaultTeamName: '%env(DEFAULT_TEAM_NAME)%'

    App\UserManagement\Application\Handler\RegisterUserHandler:
        arguments:
            $requireEmailActivation: '%env(bool:REQUIRE_EMAIL_ACTIVATION)%'

    App\Presentation\Api\AuthApiController:
        arguments:
            $requireEmailActivation: '%env(bool:REQUIRE_EMAIL_ACTIVATION)%'
        tags: ['controller.service_arguments']

    # Repository implementations
    App\UserManagement\Domain\Repository\UserRepositoryInterface:
        class: App\UserManagement\Infrastructure\Persistence\DoctrineUserRepository

    App\TaskManagement\Domain\Repository\TaskRepositoryInterface:
        class: App\TaskManagement\Infrastructure\Persistence\DoctrineTaskRepository

    App\TaskManagement\Domain\Repository\TaskTemplateRepositoryInterface:
        class: App\TaskManagement\Infrastructure\Persistence\DoctrineTaskTemplateRepository

    App\TaskManagement\Domain\Repository\TaskExecutionRepositoryInterface:
        class: App\TaskManagement\Infrastructure\Persistence\DoctrineTaskExecutionRepository

    App\PointsManagement\Domain\Repository\UserWalletRepositoryInterface:
        class: App\PointsManagement\Infrastructure\Persistence\DoctrineUserWalletRepository

    App\PointsManagement\Domain\Repository\AccountRepositoryInterface:
        class: App\PointsManagement\Infrastructure\Persistence\DoctrineAccountRepository

    App\PointsManagement\Domain\Repository\EntryRepositoryInterface:
        class: App\PointsManagement\Infrastructure\Persistence\DoctrineEntryRepository

    App\TaskManagement\Domain\Repository\BonusPointsRuleRepositoryInterface:
        class: App\TaskManagement\Infrastructure\Persistence\DoctrineBonusPointsRuleRepository

    App\TaskManagement\Domain\Repository\StatusChangeRuleRepositoryInterface:
        class: App\TaskManagement\Infrastructure\Persistence\DoctrineStatusChangeRuleRepository

    App\Notifications\Domain\Repository\InAppNotificationRepositoryInterface:
        class: App\Notifications\Infrastructure\Persistence\DoctrineInAppNotificationRepository

    App\Notifications\Domain\Repository\PushSubscriptionRepositoryInterface:
        class: App\Notifications\Infrastructure\Persistence\DoctrinePushSubscriptionRepository

    App\Notifications\Domain\Repository\NativePushDeviceRepositoryInterface:
        class: App\Notifications\Infrastructure\Persistence\DoctrineNativePushDeviceRepository

    App\Notifications\Application\Port\ActorProviderInterface:
        class: App\Notifications\Infrastructure\Security\SecurityActorProvider

    App\Notifications\Communication\Domain\Repository\NotificationPolicyRepositoryInterface:
        class: App\Notifications\Communication\Infrastructure\Persistence\DoctrineNotificationPolicyRepository

    App\UserSettings\Domain\Repository\UserSettingsRepositoryInterface:
        class: App\UserSettings\Infrastructure\Persistence\DoctrineUserSettingsRepository

    App\UserSettings\Domain\Repository\PersonalisationRepositoryInterface:
        class: App\UserSettings\Infrastructure\Persistence\DoctrinePersonalisationRepository

    App\UserSettings\Domain\Repository\OwnPictureRepositoryInterface:
        class: App\UserSettings\Infrastructure\Persistence\DoctrineOwnPictureRepository

    App\TeamManagement\Domain\Repository\TeamRepositoryInterface:
        class: App\TeamManagement\Infrastructure\Persistence\DoctrineTeamRepository

    App\TeamManagement\Domain\Repository\TeamMembershipRepositoryInterface:
        class: App\TeamManagement\Infrastructure\Persistence\PartyTeamMemberships

    App\TeamManagement\Domain\Repository\TeamInvitationRepositoryInterface:
        class: App\TeamManagement\Infrastructure\Persistence\DoctrineTeamInvitationRepository

    App\Allowance\Domain\Repository\MoneyAccountRepositoryInterface:
        class: App\Allowance\Infrastructure\Persistence\DoctrineMoneyAccountRepository

    App\Allowance\Domain\Repository\MoneyEntryRepositoryInterface:
        class: App\Allowance\Infrastructure\Persistence\DoctrineMoneyEntryRepository

    App\Allowance\Domain\Repository\MoneyTransactionRepositoryInterface:
        class: App\Allowance\Infrastructure\Persistence\DoctrineMoneyTransactionRepository

    App\Allowance\Domain\Repository\AllowanceRuleRepositoryInterface:
        class: App\Allowance\Infrastructure\Persistence\DoctrineAllowanceRuleRepository

    App\Allowance\Domain\Repository\WeekClosureRepositoryInterface:
        class: App\Allowance\Infrastructure\Persistence\DoctrineWeekClosureRepository

    App\Allowance\Domain\Repository\PayoutRepositoryInterface:
        class: App\Allowance\Infrastructure\Persistence\DoctrinePayoutRepository

    App\Allowance\Domain\Repository\SavingsGoalRepositoryInterface:
        class: App\Allowance\Infrastructure\Persistence\DoctrineSavingsGoalRepository

    App\Shared\Domain\Period\ClosedWeeksInterface:
        class: App\Allowance\Infrastructure\Persistence\SettledWeeks

    App\Allowance\Application\Service\WalletView:
        arguments:
            $currency: '%app.allowance_currency%'

    App\Allowance\Application\Service\AllowanceWeekView:
        arguments:
            $currency: '%app.allowance_currency%'

    App\Allowance\Application\Service\LedgerView:
        arguments:
            $currency: '%app.allowance_currency%'

    App\Allowance\Application\Service\GoalsView:
        arguments:
            $currency: '%app.allowance_currency%'

    App\Party\Domain\Repository\PartyRepositoryInterface:
        class: App\Party\Infrastructure\Persistence\Doctrine\DoctrinePartyRepository

    App\Party\Domain\Repository\PartyRelationshipRepositoryInterface:
        class: App\Party\Infrastructure\Persistence\Doctrine\DoctrinePartyRelationshipRepository

    App\Party\Domain\Repository\PartyRoleRepositoryInterface:
        class: App\Party\Infrastructure\Persistence\Doctrine\DoctrinePartyRoleRepository

    App\Party\Domain\Repository\ResponsibilityRepositoryInterface:
        class: App\Party\Infrastructure\Persistence\Doctrine\DoctrineResponsibilityRepository

    App\Party\Domain\Repository\SignatureRepositoryInterface:
        class: App\Party\Infrastructure\Persistence\Doctrine\DoctrineSignatureRepository

    # Policy implementations
    App\TaskManagement\Domain\Policy\TaskApprovalPolicyInterface:
        class: App\TaskManagement\Domain\Policy\TeamAdminApprovalPolicy

    # Strategy implementations
    App\TaskManagement\Domain\Strategy\PointsAwardStrategyInterface:
        class: App\TaskManagement\Domain\Strategy\TaskApprovalPointsAwardStrategy

    App\TaskManagement\Domain\Strategy\ExecutionPointsAwardStrategyInterface:
        class: App\TaskManagement\Domain\Strategy\ExecutionApprovalPointsAwardStrategy

    # Clock implementation
    App\Shared\Domain\Clock\ClockInterface:
        class: App\Shared\Infrastructure\Clock\SystemClock

    # Message buses - bind specific buses to controller parameters
    App\Presentation\Api\TaskApiController:
        arguments:
            $commandBus: '@command.bus'
            $queryBus: '@query.bus'

    App\Presentation\Api\BonusPointsRuleApiController:
        arguments:
            $commandBus: '@command.bus'
            $queryBus: '@query.bus'

    App\Presentation\Api\StatusChangeRuleApiController:
        arguments:
            $commandBus: '@command.bus'
            $queryBus: '@query.bus'

    App\Presentation\Api\TeamApiController:
        arguments:
            $commandBus: '@command.bus'
            $queryBus: '@query.bus'

    App\Presentation\Api\PushSubscriptionApiController:
        arguments:
            $vapidPublicKey: '%env(VAPID_PUBLIC_KEY)%'
        tags: ['controller.service_arguments']

    App\Presentation\Api\NotificationPolicyApiController:
        arguments:
            $commandBus: '@command.bus'

    App\Presentation\Api\AllowanceRuleApiController:
        arguments:
            $commandBus: '@command.bus'
            $currency: '%app.allowance_currency%'

    App\Presentation\Api\AllowanceWeekApiController:
        arguments:
            $commandBus: '@command.bus'

    App\Presentation\Api\AllowanceWalletApiController:
        arguments:
            $commandBus: '@command.bus'

    App\Presentation\Api\SavingsGoalApiController:
        arguments:
            $commandBus: '@command.bus'

    # Locale Listener
    App\Shared\Infrastructure\EventListener\LocaleListener:
        arguments:
            $defaultLocale: '%kernel.default_locale%'
        tags:
            - { name: kernel.event_subscriber }

    App\Notifications\Communication\EventSubscriber\CalendarEventChangedSubscriber:
        arguments:
            $secret: '%kernel.secret%'

    # User Registration Event Subscriber
    App\Notifications\Communication\EventSubscriber\UserRegisteredEventSubscriber:
        arguments:
            $appUrl: '%env(APP_URL)%'

    # Notification adapters
    App\Notifications\Infrastructure\Adapter\EmailNotificationAdapter:
        arguments:
            $fromEmail: '%env(MAILER_FROM_EMAIL)%'
            $fromName: '%env(MAILER_FROM_NAME)%'
        tags: ['notification.adapter']

    App\Notifications\Infrastructure\Adapter\SmsApiAdapter:
        arguments:
            $apiUrl: '%env(SMS_API_URL)%'
            $apiToken: '%env(SMS_API_TOKEN)%'
        tags: ['notification.adapter']

    App\Notifications\Infrastructure\Adapter\InAppNotificationAdapter:
        tags: ['notification.adapter']

    App\Notifications\Infrastructure\Adapter\PushNotificationAdapter:
        arguments:
            $commandBus: '@command.bus'
        tags: ['notification.adapter']

    App\Notifications\Domain\Port\PushSenderInterface:
        class: App\Notifications\Infrastructure\Push\MinishlinkPushSender
        arguments:
            $publicKey: '%env(VAPID_PUBLIC_KEY)%'
            $privateKey: '%env(VAPID_PRIVATE_KEY)%'
            $subject: '%env(VAPID_SUBJECT)%'
            $applicationUrl: '%env(APP_URL)%'

    # Phones with the mobile app, through Firebase Cloud Messaging; empty FCM_SERVICE_ACCOUNT keeps it off
    App\Notifications\Domain\Port\NativePushSenderInterface:
        class: App\Notifications\Infrastructure\Push\FcmPushSender
        arguments:
            $serviceAccount: '%env(FCM_SERVICE_ACCOUNT)%'

    App\Notifications\Application\Handler\SendNotificationHandler:
        arguments:
            $adapters: !tagged_iterator notification.adapter

    App\Notifications\Application\Service\NotificationFacade:
        arguments:
            $adapters: !tagged_iterator notification.adapter

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones


    App\ActionPlanning\Domain\Repository\ActionPlanRepositoryInterface:
        class: App\ActionPlanning\Infrastructure\Persistence\DoctrineActionPlanRepository

    App\DayPlanning\Domain\Repository\CalendarEventRepositoryInterface:
        class: App\DayPlanning\Infrastructure\Persistence\DoctrineCalendarEventRepository

    App\DayPlanning\Domain\Repository\CalendarTagRepositoryInterface:
        class: App\DayPlanning\Infrastructure\Persistence\DoctrineCalendarTagRepository

    App\DayPlanning\Application\Service\ConflictConfirmation:
        arguments:
            $secret: '%kernel.secret%'

    App\SchoolTimetable\Domain\Repository\SchoolAccountRepositoryInterface:
        class: App\SchoolTimetable\Infrastructure\Persistence\DoctrineSchoolAccountRepository

    App\SchoolTimetable\Domain\Repository\ImportedLessonRepositoryInterface:
        class: App\SchoolTimetable\Infrastructure\Persistence\DoctrineImportedLessonRepository

    App\SchoolTimetable\Domain\Service\TimetableProviderInterface:
        class: App\SchoolTimetable\Infrastructure\Mobidziennik\MobidziennikProvider

    App\SchoolTimetable\Domain\Service\SecretCipherInterface:
        class: App\SchoolTimetable\Infrastructure\Security\SodiumSecretCipher
        arguments:
            $secret: '%env(default:kernel.secret:SCHOOL_TIMETABLE_SECRET)%'

    App\SchoolTimetable\Application\Service\TimetableImport:
        arguments:
            $timeZone: '%env(default:school_timetable_zone:SCHOOL_TIMETABLE_TIME_ZONE)%'

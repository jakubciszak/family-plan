<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Plan - Prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #4a90e2;
            --primary-dark: #357abd;
            --success-color: #5cb85c;
            --warning-color: #f0ad4e;
            --danger-color: #d9534f;
            --info-color: #5bc0de;
            --background: #f5f7fa;
            --card-background: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --border-color: #e1e4e8;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 4px 16px rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: var(--background);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header Styles */
        .app-header {
            background: var(--card-background);
            border-bottom: 2px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
        }

        .header-left h1 {
            font-size: 1.5rem;
            color: var(--primary-color);
            font-weight: 700;
        }

        .hamburger-menu {
            display: none;
            flex-direction: column;
            gap: 4px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
        }

        .hamburger-menu span {
            width: 25px;
            height: 3px;
            background: var(--text-primary);
            transition: all 0.3s;
        }

        .app-nav {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .app-nav button {
            background: none;
            border: none;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 1rem;
            color: var(--text-secondary);
            transition: all 0.3s;
            border-radius: 4px;
        }

        .app-nav button:hover {
            background: var(--background);
            color: var(--primary-color);
        }

        .app-nav button.nav-active {
            background: var(--primary-color);
            color: white;
        }

        .user-info {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .user-welcome {
            font-weight: 500;
            color: var(--text-primary);
        }

        .user-points {
            background: var(--success-color);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .language-switcher {
            display: flex;
            gap: 0.5rem;
        }

        .language-switcher button {
            background: var(--card-background);
            border: 1px solid var(--border-color);
            padding: 0.25rem 0.5rem;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .language-switcher button.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* Main Content */
        .app-main {
            flex: 1;
            padding: 2rem;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        /* Login/Register Page */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
        }

        .auth-card {
            background: var(--card-background);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: var(--shadow-hover);
            max-width: 400px;
            width: 90%;
        }

        .auth-card h2 {
            margin-bottom: 1.5rem;
            color: var(--primary-color);
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-block;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .btn-success {
            background: var(--success-color);
            color: white;
        }

        .btn-danger {
            background: var(--danger-color);
            color: white;
        }

        .btn-warning {
            background: var(--warning-color);
            color: white;
        }

        .btn-info {
            background: var(--info-color);
            color: white;
        }

        .btn-secondary {
            background: var(--text-secondary);
            color: white;
        }

        .btn-full {
            width: 100%;
        }

        .auth-switch {
            text-align: center;
            margin-top: 1rem;
            color: var(--text-secondary);
        }

        .auth-switch a {
            color: var(--primary-color);
            cursor: pointer;
            text-decoration: none;
        }

        .auth-switch a:hover {
            text-decoration: underline;
        }

        /* Cards */
        .card {
            background: var(--card-background);
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
        }

        .card h3 {
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        /* Task List */
        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .task-filters {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .task-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .task-card {
            background: var(--card-background);
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            transition: all 0.3s;
            border-left: 4px solid var(--primary-color);
        }

        .task-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-4px);
        }

        .task-card.status-pending {
            border-left-color: var(--warning-color);
        }

        .task-card.status-completed {
            border-left-color: var(--info-color);
        }

        .task-card.status-approved {
            border-left-color: var(--success-color);
        }

        .task-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .task-description {
            color: var(--text-secondary);
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .task-meta {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .task-meta span {
            background: var(--background);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            color: var(--text-secondary);
        }

        .task-points {
            background: var(--success-color) !important;
            color: white !important;
            font-weight: 600;
        }

        .task-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .task-actions button {
            flex: 1;
            min-width: 100px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal {
            background: var(--card-background);
            border-radius: 12px;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-hover);
        }

        .modal h2 {
            margin-bottom: 1.5rem;
            color: var(--primary-color);
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 1.5rem;
        }

        /* Table */
        .table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .table th,
        .table td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .table th {
            background: var(--background);
            font-weight: 600;
            color: var(--text-primary);
        }

        .table tr:hover {
            background: var(--background);
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .badge-admin {
            background: var(--danger-color);
            color: white;
        }

        .badge-user {
            background: var(--info-color);
            color: white;
        }

        .badge-active {
            background: var(--success-color);
            color: white;
        }

        .badge-inactive {
            background: var(--text-secondary);
            color: white;
        }

        /* Alerts */
        .alert {
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        /* Team Cards */
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .team-card {
            background: var(--card-background);
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            border-top: 4px solid var(--primary-color);
        }

        .team-card h3 {
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .team-members {
            margin-top: 1rem;
        }

        .team-member {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .team-member:last-child {
            border-bottom: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .app-header {
                padding: 1rem;
            }

            .hamburger-menu {
                display: flex;
                order: 2;
            }

            .header-left {
                order: 1;
            }

            .app-nav {
                order: 4;
                width: 100%;
                flex-direction: column;
                display: none;
                margin-top: 1rem;
                padding-top: 1rem;
                border-top: 1px solid var(--border-color);
            }

            .app-nav.mobile-open {
                display: flex;
            }

            .app-nav button {
                width: 100%;
                text-align: left;
            }

            .user-info {
                order: 3;
                font-size: 0.9rem;
            }

            .app-main {
                padding: 1rem;
            }

            .task-grid {
                grid-template-columns: 1fr;
            }

            .team-grid {
                grid-template-columns: 1fr;
            }

            .task-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .modal {
                padding: 1.5rem;
            }
        }

        .hidden {
            display: none;
        }

        /* Loading Spinner */
        .spinner {
            border: 3px solid var(--background);
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

        // ==================== STATE MANAGEMENT ====================
        class AppState {
            constructor() {
                this.currentUser = null;
                this.currentPage = 'tasks';
                this.currentLanguage = localStorage.getItem('language') || 'pl';
                this.isMobileMenuOpen = false;
                this.showRegister = false;
                this.taskFilter = 'all';
                this.data = this.loadData();
            }

            loadData() {
                const saved = localStorage.getItem('familyPlanData');
                return saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(MOCK_DATA));
            }

            saveData() {
                localStorage.setItem('familyPlanData', JSON.stringify(this.data));
            }

            t(key, params = {}) {
                let text = translations[this.currentLanguage][key] || key;
                Object.keys(params).forEach(param => {
                    text = text.replace(`{{${param}}}`, params[param]);
                });
                return text;
            }

            login(email, password) {
                const user = this.data.users.find(u => u.email === email && u.password === password);
                if (user) {
                    this.currentUser = user;
                    return true;
                }
                return false;
            }

            register(email, password, name) {
                const exists = this.data.users.find(u => u.email === email);
                if (exists) return false;

                const newUser = {
                    id: this.data.users.length + 1,
                    email,
                    password,
                    name,
                    role: 'ROLE_USER',
                    points: 0,
                    teamId: null
                };
                this.data.users.push(newUser);
                this.saveData();
                return true;
            }

            logout() {
                this.currentUser = null;
                this.currentPage = 'tasks';
            }

            setLanguage(lang) {
                this.currentLanguage = lang;
                localStorage.setItem('language', lang);
            }

            createTask(taskData) {
                const newTask = {
                    id: this.data.tasks.length + 1,
                    ...taskData,
                    status: 'pending',
                    createdBy: this.currentUser.id,
                    teamId: this.currentUser.teamId
                };
                this.data.tasks.push(newTask);
                this.saveData();
            }

            updateTaskStatus(taskId, newStatus) {
                const task = this.data.tasks.find(t => t.id === taskId);
                if (task) {
                    const oldStatus = task.status;
                    task.status = newStatus;

                    // Award points when approved
                    if (newStatus === 'approved' && task.assignedUserId) {
                        const user = this.data.users.find(u => u.id === task.assignedUserId);
                        if (user) {
                            user.points += task.points;
                            if (this.currentUser.id === user.id) {
                                this.currentUser.points = user.points;
                            }
                        }
                    }

                    // Remove points if rejected
                    if (oldStatus === 'approved' && newStatus !== 'approved' && task.assignedUserId) {
                        const user = this.data.users.find(u => u.id === task.assignedUserId);
                        if (user) {
                            user.points -= task.points;
                            if (this.currentUser.id === user.id) {
                                this.currentUser.points = user.points;
                            }
                        }
                    }

                    this.saveData();
                }
            }

            deleteTask(taskId) {
                this.data.tasks = this.data.tasks.filter(t => t.id !== taskId);
                this.saveData();
            }

            assignTask(taskId, userId) {
                const task = this.data.tasks.find(t => t.id === taskId);
                if (task) {
                    task.assignedUserId = userId;
                    this.saveData();
                }
            }

            createTeam(teamData) {
                const newTeam = {
                    id: this.data.teams.length + 1,
                    ...teamData,
                    adminId: this.currentUser.id
                };
                this.data.teams.push(newTeam);
                this.saveData();
            }

            getUserTasks() {
                if (this.currentUser.role === 'ROLE_ADMIN') {
                    return this.data.tasks.filter(t => t.teamId === this.currentUser.teamId);
                }
                return this.data.tasks.filter(t =>
                    t.assignedUserId === this.currentUser.id ||
                    (t.teamId === this.currentUser.teamId && !t.assignedUserId)
                );
            }

            getFilteredTasks() {
                let tasks = this.getUserTasks();
                if (this.taskFilter !== 'all') {
                    tasks = tasks.filter(t => t.status === this.taskFilter);
                }
                return tasks;
            }

            getUsersByTeam(teamId) {
                return this.data.users.filter(u => u.teamId === teamId);
            }

            getTeamMembers(teamId) {
                return this.data.users.filter(u => u.teamId === teamId);
            }
        }

        function updatePassword() {
            const current = document.getElementById('settings-current-password').value;
            const newPass = document.getElementById('settings-new-password').value;
            const confirm = document.getElementById('settings-confirm-password').value;

            if (current !== app.currentUser.password) {
                alert('Current password is incorrect');
                return;

            if (newPass !== confirm) {
                alert('Passwords do not match');
                return;
            }

            app.currentUser.password = newPass;
            const user = app.data.users.find(u => u.id === app.currentUser.id);
            if (user) user.password = newPass;
            app.saveData();
            alert('Password updated successfully');
            render();

                    </div>
                    <div class="modal-actions">
                        <button class="btn btn-secondary" onclick="closeModal()">${app.t('tasks.cancel')}</button>
                        <button class="btn btn-primary" onclick="createTeam()">${app.t('tasks.save')}</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function createTeam() {
            const name = document.getElementById('new-team-name').value;
            const description = document.getElementById('new-team-description').value;

            if (!name) {
                alert('Please enter a team name');
                return;
            }

            app.createTeam({ name, description });
            closeModal();
            render();
        }

        function showCreateBonusRuleModal() {
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal">
                    <h2>${app.t('bonus.create')}</h2>
                    <div class="form-group">
                        <label>${app.t('bonus.name')}</label>
                        <input type="text" id="new-bonus-name">
                    </div>
                    <div class="form-group">
                        <label>${app.t('bonus.description')}</label>
                        <textarea id="new-bonus-description" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label>${app.t('bonus.points')}</label>
                        <input type="number" id="new-bonus-points" value="50" min="0">
                    </div>
                    <div class="form-group">
                        <label>${app.t('bonus.type')}</label>
                        <select id="new-bonus-type">
                            <option value="consecutive_days">${app.t('bonus.consecutiveDays')}</option>
                            <option value="monthly_task_count">${app.t('bonus.monthlyTaskCount')}</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>${app.t('bonus.requiredDays')} / ${app.t('bonus.requiredCount')}</label>
                        <input type="number" id="new-bonus-required" value="7" min="1">
                    </div>
                    <div class="modal-actions">
                        <button class="btn btn-secondary" onclick="closeModal()">${app.t('tasks.cancel')}</button>
                        <button class="btn btn-primary" onclick="createBonusRule()">${app.t('tasks.save')}</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function createBonusRule() {
            const name = document.getElementById('new-bonus-name').value;
            const description = document.getElementById('new-bonus-description').value;
            const bonusPoints = parseInt(document.getElementById('new-bonus-points').value);
            const type = document.getElementById('new-bonus-type').value;
            const required = parseInt(document.getElementById('new-bonus-required').value);

            if (!name) {
                alert('Please enter a rule name');
                return;
            }

            const newRule = {
                id: app.data.bonusRules.length + 1,
                name,
                description,
                bonusPoints,
                type,
                teamId: app.currentUser.teamId
            };

            if (type === 'consecutive_days') {
                newRule.requiredDays = required;
            } else {
                newRule.requiredCount = required;
            }

            app.data.bonusRules.push(newRule);
            app.saveData();
            closeModal();
            render();
        }

        function closeModal() {
            const modal = document.querySelector('.modal-overlay');
            if (modal) modal.remove();
        }

        function attachEventListeners() {
            // Close modal on overlay click
            document.querySelectorAll('.modal-overlay').forEach(overlay => {
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) closeModal();
                });
            });
        }

        // ==================== INITIALIZE APP ====================
        render();
    </script>
</body>
</html>

name: family-plan

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  database:
    image: postgres:16.14-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-family_plan}
      POSTGRES_USER: ${POSTGRES_USER:-family_plan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -d "$${POSTGRES_DB}" -U "$${POSTGRES_USER}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  database-backup:
    image: postgres:16.14-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-family_plan}
      POSTGRES_USER: ${POSTGRES_USER:-family_plan}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    command:
      - /bin/sh
      - -ec
      - |
        while true; do
          filename="/backups/$$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
          pg_dump --host=database --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}" | gzip > "$${filename}"
          find /backups -type f -name '*.sql.gz' -mtime "+$${BACKUP_RETENTION_DAYS}" -delete
          sleep 86400
        done
    volumes:
      - database_backups:/backups
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  php:
    image: ghcr.io/jakubciszak/family-plan-php:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      APP_URL: ${APP_SCHEME:-https}://${APP_DOMAIN:?APP_DOMAIN is required}
      DEFAULT_URI: ${APP_SCHEME:-https}://${APP_DOMAIN:?APP_DOMAIN is required}
      TRUSTED_PROXIES: 127.0.0.1,REMOTE_ADDR
      DATABASE_URL: postgresql://${POSTGRES_USER:-family_plan}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@database:5432/${POSTGRES_DB:-family_plan}?serverVersion=16&charset=utf8
      POSTGRES_USER: ${POSTGRES_USER:-family_plan}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?SUPER_ADMIN_EMAIL is required}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-Super Admin}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?SUPER_ADMIN_PASSWORD is required}
      CORS_ALLOWED_ORIGIN: ${APP_SCHEME:-https}://${APP_DOMAIN:?APP_DOMAIN is required}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MAILER_FROM_EMAIL: ${MAILER_FROM_EMAIL:-noreply@familyplan.local}
      MAILER_FROM_NAME: ${MAILER_FROM_NAME:-Family Plan}
      SMS_API_URL: ${SMS_API_URL:-https://api.smsapi.pl}
      SMS_API_TOKEN: ${SMS_API_TOKEN:-}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  backend:
    image: ghcr.io/jakubciszak/family-plan-nginx:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    depends_on:
      php:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --spider http://127.0.0.1/health || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - backend
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  frontend:
    image: ghcr.io/jakubciszak/family-plan-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --spider http://127.0.0.1/health || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - edge
      - backend
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  edge:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    command:
      - caddy
      - reverse-proxy
      - --from
      - ${APP_SCHEME:-https}://${APP_DOMAIN:?APP_DOMAIN is required}
      - --to
      - frontend:80
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - edge
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_config:
  caddy_data:
  database_backups:
  database_data:

networks:
  backend:
    internal: true
  edge:

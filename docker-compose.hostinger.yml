services:
  database:
    image: postgres:16-alpine
    container_name: family-plan-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - family-plan-network

  php:
    image: ghcr.io/jakubciszak/family-plan-php:${IMAGE_TAG:-latest}
    container_name: family-plan-php
    restart: unless-stopped
    working_dir: /app
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_SECRET: ${APP_SECRET:-CHANGE_ME}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@familyplan.local}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-Super Admin}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-CHANGE_ME}
      REQUIRE_EMAIL_ACTIVATION: ${REQUIRE_EMAIL_ACTIVATION:-true}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MAILER_FROM_EMAIL: ${MAILER_FROM_EMAIL:-noreply@familyplan.local}
      MAILER_FROM_NAME: ${MAILER_FROM_NAME:-Family Plan}
      APP_URL: ${APP_URL:-https://family-plan.srv1201847.hstgr.cloud}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - family-plan-network

  nginx:
    image: ghcr.io/jakubciszak/family-plan-nginx:${IMAGE_TAG:-latest}
    container_name: family-plan-nginx
    restart: unless-stopped
    depends_on:
      - php
    networks:
      - family-plan-network
      - proxy-net

  frontend:
    image: ghcr.io/jakubciszak/family-plan-frontend:${IMAGE_TAG:-latest}
    container_name: family-plan-frontend
    restart: unless-stopped
    depends_on:
      - nginx
    networks:
      - family-plan-network
      - proxy-net

volumes:
  database_data:
    driver: local

networks:
  family-plan-network:
    driver: bridge
  proxy-net:
    external: true
    name: proxy-net

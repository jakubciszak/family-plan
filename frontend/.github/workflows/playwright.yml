name: Playwright Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Mocked E2E tests - run on all branches
  test-mocked:
    name: Mocked E2E Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
    
    - name: Install Playwright Browsers
      working-directory: ./frontend
      run: npx playwright install --with-deps chromium
    
    - name: Run Mocked Playwright tests
      working-directory: ./frontend
      run: npm test -- --project=chromium
    
    - name: Upload HTML test report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-mocked
        path: frontend/playwright-report/
        retention-days: 30
    
    - name: Upload test screenshots and videos
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-test-results-mocked
        path: frontend/test-results/
        retention-days: 30
    
    - name: Upload trace files
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-traces-mocked
        path: frontend/test-results/**/*.zip
        retention-days: 30

  # Integration tests with real API - run only on main branch
  test-integration:
    name: Integration Tests (Real API)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Only run on main branch
    if: github.ref == 'refs/heads/main'
    needs: test-mocked
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Create environment file
      run: |
        cat > .env << EOF
        APP_ENV=test
        APP_SECRET=test_secret_key_for_ci
        DATABASE_URL=postgresql://app:!ChangeMe!@database:5432/app?serverVersion=16&charset=utf8
        SUPER_ADMIN_EMAIL=admin@familyplan.local
        SUPER_ADMIN_NAME=Super Admin
        SUPER_ADMIN_PASSWORD=admin123
        EOF
    
    - name: Start services with Docker Compose
      run: |
        docker-compose up -d database php nginx frontend
        echo "Waiting for services to be ready..."
        sleep 30
    
    - name: Check services are running
      run: |
        docker-compose ps
        curl --retry 10 --retry-delay 3 --retry-connrefused http://localhost:8080/api/auth/me || true
        curl --retry 10 --retry-delay 3 --retry-connrefused http://localhost:3000 || true
    
    - name: Run database migrations
      run: |
        docker-compose exec -T php php bin/console doctrine:migrations:migrate --no-interaction
    
    - name: Create super admin user
      run: |
        docker-compose exec -T php php bin/console app:create-super-admin
    
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci
    
    - name: Install Playwright Browsers
      working-directory: ./frontend
      run: npx playwright install --with-deps chromium
    
    - name: Run Integration tests
      working-directory: ./frontend
      env:
        BASE_URL: http://localhost:3000
        SUPER_ADMIN_EMAIL: admin@familyplan.local
        SUPER_ADMIN_PASSWORD: admin123
      run: npm run test:integration
    
    - name: Upload HTML test report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-integration
        path: frontend/playwright-report/
        retention-days: 30
    
    - name: Upload test screenshots and videos
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-test-results-integration
        path: frontend/test-results/
        retention-days: 30
    
    - name: Upload trace files
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-traces-integration
        path: frontend/test-results/**/*.zip
        retention-days: 30
    
    - name: Show service logs on failure
      if: failure()
      run: |
        echo "=== PHP Logs ==="
        docker-compose logs php
        echo "=== Nginx Logs ==="
        docker-compose logs nginx
        echo "=== Database Logs ==="
        docker-compose logs database
    
    - name: Stop services
      if: always()
      run: docker-compose down -v

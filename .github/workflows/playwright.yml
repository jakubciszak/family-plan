name: Playwright Tests

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  # Mocked E2E tests - run on all branches
  test-mocked:
    name: Mocked E2E Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
    
    - name: Install Playwright Browsers
      working-directory: ./frontend
      run: npx playwright install --with-deps chromium
    
    - name: Run Mocked Playwright tests
      working-directory: ./frontend
      run: npm test -- --project=chromium
    
    - name: Upload HTML test report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-mocked
        path: frontend/playwright-report/
        retention-days: 30
    
    - name: Upload test screenshots and videos
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-test-results-mocked
        path: frontend/test-results/
        retention-days: 30
    
    - name: Upload trace files
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-traces-mocked
        path: frontend/test-results/**/*.zip
        retention-days: 30

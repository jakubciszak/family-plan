name: PHPUnit Tests

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  unit-tests:
    name: Unit Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: ctype, iconv, pdo, pdo_pgsql, mbstring, xml, tokenizer, intl
        coverage: none
        tools: composer:v2
    
    - name: Validate composer.json and composer.lock
      run: composer validate
    
    - name: Cache Composer dependencies
      uses: actions/cache@v4
      with:
        path: |
          vendor
          ~/.composer/cache/files
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-
    
    - name: Install dependencies
      # Ignore ext-redis as it's only needed for caching in production, not for unit tests
      run: composer install --prefer-dist --no-progress --ignore-platform-req=ext-redis
    
    - name: Run Unit Tests
      run: |
        mkdir -p test-results
        vendor/bin/phpunit --testsuite unit --testdox --log-junit test-results/unit-tests.xml
    
    - name: Upload unit test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: unit-test-results
        path: test-results/
        retention-days: 30

  integration-tests:
    name: Integration Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: unit-tests

    permissions:
      contents: read

    services:
      database:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: '!ChangeMe!'
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://app:!ChangeMe!@127.0.0.1:5432/app?serverVersion=16&charset=utf8"
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: ctype, iconv, pdo, pdo_pgsql, mbstring, xml, tokenizer, intl
        coverage: none
        tools: composer:v2
    
    - name: Validate composer.json and composer.lock
      run: composer validate
    
    - name: Cache Composer dependencies
      uses: actions/cache@v4
      with:
        path: |
          vendor
          ~/.composer/cache/files
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-
    
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --ignore-platform-req=ext-redis
    
    - name: Run Integration Tests
      run: |
        mkdir -p test-results
        vendor/bin/phpunit --testsuite integration --testdox --log-junit test-results/integration-tests.xml
    
    - name: Upload integration test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-results
        path: test-results/
        retention-days: 30

  acceptance-tests:
    name: Behat Acceptance Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: ctype, iconv, pdo, pdo_pgsql, mbstring, xml, tokenizer, intl
        coverage: none
        tools: composer:v2
    
    - name: Validate composer.json and composer.lock
      run: composer validate
    
    - name: Cache Composer dependencies
      uses: actions/cache@v4
      with:
        path: |
          vendor
          ~/.composer/cache/files
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-
    
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --ignore-platform-req=ext-redis
    
    - name: Run Behat Acceptance Tests
      run: |
        mkdir -p test-results
        vendor/bin/behat --no-colors --format=pretty --out=std --format=junit --out=test-results
    
    - name: Upload acceptance test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: acceptance-test-results
        path: test-results/
        retention-days: 30

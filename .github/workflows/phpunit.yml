name: PHPUnit Tests

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  phpunit:
    name: PHPUnit Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: ctype, iconv, pdo, pdo_sqlite, mbstring, xml, tokenizer, intl
        coverage: none
        tools: composer:v2
    
    - name: Validate composer.json and composer.lock
      run: composer validate
    
    - name: Cache Composer dependencies
      uses: actions/cache@v4
      with:
        path: |
          vendor
          ~/.composer/cache/files
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-
    
    - name: Install dependencies
      # Ignore ext-redis as it's only needed for caching in production, not for unit tests
      run: composer install --prefer-dist --no-progress --ignore-platform-req=ext-redis
    
    - name: Run PHPUnit tests
      run: |
        mkdir -p test-results
        vendor/bin/phpunit --testdox --log-junit test-results/junit.xml
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: phpunit-results
        path: test-results/
        retention-days: 30

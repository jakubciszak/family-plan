name: Deploy to Hostinger

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag wydania do wdrożenia (np. v1.2.3). Puste = ostatnie opublikowane wydanie."
        required: false
        type: string
      skip_checks:
        description: "Wdroż mimo braku zielonych testów (rollback starego wydania, gdy przepadły logi runów)."
        required: false
        default: false
        type: boolean
      apk_only:
        description: "Tylko zbuduj APK i dołącz go do wydania, bez wdrażania serwera."
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/family-plan-app
  APP_HEALTH_URL: https://family-plan.srv1201847.hstgr.cloud
  # Workflowy, które muszą być zielone na commicie wydania, zanim cokolwiek pójdzie na produkcję.
  # Nazwy z pola `name:` w .github/workflows/*.yml.
  REQUIRED_CHECKS: |
    PHPUnit Tests
    Playwright Tests
    Mobile App Tests
  CHECKS_TIMEOUT_MINUTES: "60"

jobs:
  resolve-release:
    name: Resolve release
    runs-on: ubuntu-latest
    # Automatycznie wdrażamy tylko pełne wydania. Pre-release da się wypchnąć ręcznie
    # przez workflow_dispatch z podanym tagiem.
    if: github.event_name != 'release' || github.event.release.prerelease == false

    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Pick the release to deploy
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          tag="${EVENT_TAG:-${INPUT_TAG:-}}"
          if [ -z "$tag" ]; then
            tag=$(gh release view --json tagName --jq .tagName)
            echo "Nie podano tagu — wdrażam ostatnie wydanie: ${tag}"
          fi

          # Wdrażamy wyłącznie opublikowane wydania — nigdy szkicu ani gołej gałęzi.
          if ! state=$(gh release view "$tag" --json isDraft --jq .isDraft); then
            echo "Nie ma wydania o tagu ${tag}. Najpierw utwórz release."
            exit 1
          fi
          if [ "$state" != "false" ]; then
            echo "Wydanie ${tag} jest szkicem — opublikuj je przed wdrożeniem."
            exit 1
          fi

          sha=$(gh api "repos/${GH_REPO}/commits/${tag}" --jq .sha)

          # Tag obrazu Dockera dopuszcza tylko [A-Za-z0-9_.-] i nie zaczyna się od . ani -
          version=$(printf '%s' "$tag" | tr -c 'A-Za-z0-9_.-' '-')
          case "$version" in
            [.-]*) version="v${version}" ;;
          esac

          {
            echo "tag=${tag}"
            echo "sha=${sha}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

          echo "Wydanie ${tag} (${sha}) → obrazy z tagiem ${version}" >> "$GITHUB_STEP_SUMMARY"

      - name: Require green checks on the released commit
        if: ${{ !inputs.skip_checks }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.release.outputs.sha }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          required=()
          while IFS= read -r name; do
            if [ -n "$name" ]; then
              required+=("$name")
            fi
          done <<< "${REQUIRED_CHECKS}"

          deadline=$(( $(date +%s) + CHECKS_TIMEOUT_MINUTES * 60 ))
          runs=$(mktemp)

          while :; do
            gh api "repos/${GH_REPO}/actions/runs?head_sha=${SHA}&per_page=100" > "$runs"

            pending=()
            failed=()
            for name in "${required[@]}"; do
              entry=$(jq -r --arg n "$name" '
                [.workflow_runs[] | select(.name == $n)]
                | sort_by(.run_started_at) | last // empty
                | "\(.status)|\(.conclusion // "")|\(.html_url)"' "$runs")

              if [ -z "$entry" ]; then
                pending+=("${name}: brak runu na tym commicie")
                continue
              fi

              status=${entry%%|*}
              rest=${entry#*|}
              conclusion=${rest%%|*}
              url=${rest#*|}

              if [ "$status" != "completed" ]; then
                pending+=("${name}: ${status}")
              elif [ "$conclusion" = "success" ]; then
                echo "✓ ${name}"
              else
                failed+=("${name}: ${conclusion} — ${url}")
              fi
            done

            if [ ${#failed[@]} -gt 0 ]; then
              echo "Testy na commicie wydania ${TAG} (${SHA}) nie są zielone:"
              printf '  - %s\n' "${failed[@]}"
              {
                echo "### Deployment zatrzymany — czerwone testy"
                printf '%s\n' "${failed[@]/#/- }"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            if [ ${#pending[@]} -eq 0 ]; then
              echo "Wszystkie wymagane testy przeszły na ${SHA}."
              exit 0
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Po ${CHECKS_TIMEOUT_MINUTES} min nadal czekam na:"
              printf '  - %s\n' "${pending[@]}"
              {
                echo "### Deployment zatrzymany — testy nie skończyły się w czasie"
                printf '%s\n' "${pending[@]/#/- }"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            echo "Czekam na: ${pending[*]}"
            sleep 30
          done

      - name: Note the skipped gate
        if: ${{ inputs.skip_checks }}
        run: |
          echo "⚠️ Bramka testów pominięta ręcznie (skip_checks) dla ${{ steps.release.outputs.tag }}." \
            >> "$GITHUB_STEP_SUMMARY"

  build-and-push:
    name: Build and push image
    needs: resolve-release
    # Bez obrazu nie rusza też deploy, który na niego czeka.
    if: ${{ !inputs.apk_only }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push application image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frankenphp/Dockerfile.prod
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:latest
            ${{ env.APP_IMAGE }}:${{ needs.resolve-release.outputs.version }}
            ${{ env.APP_IMAGE }}:${{ needs.resolve-release.outputs.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy ${{ needs.resolve-release.outputs.tag }}
    needs: [resolve-release, build-and-push]
    runs-on: ubuntu-latest

    steps:
      - name: Check required secrets are available
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          VPS_ID: ${{ secrets.HOSTINGER_VPS_ID }}
        run: |
          missing=""
          [ -n "${HOSTINGER_API_TOKEN}" ] || missing="${missing} HOSTINGER_API_TOKEN"
          [ -n "${VPS_ID}" ] || missing="${missing} HOSTINGER_VPS_ID"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:${missing}"
            echo "Set them under Settings > Secrets and variables > Actions > Repository secrets."
            echo "Environment-scoped secrets are not visible to this job."
            exit 1
          fi
          echo "Both secrets are present."

      - name: Trigger project update on Hostinger VPS
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          VPS_ID: ${{ secrets.HOSTINGER_VPS_ID }}
          PROJECT: family-plan-project
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST \
            "https://developers.hostinger.com/api/vps/v1/virtual-machines/${VPS_ID}/docker/${PROJECT}/update" \
            -H "Authorization: Bearer ${HOSTINGER_API_TOKEN}" \
            -H "Content-Type: application/json"

      - name: Wait for the application to come back up
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            api=$(curl -s -o /dev/null -w '%{http_code}' "${APP_HEALTH_URL}/api/auth/me" || true)
            spa=$(curl -s -o /dev/null -w '%{http_code}' "${APP_HEALTH_URL}/" || true)
            jwt=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "${APP_HEALTH_URL}/api/auth/token" || true)
            echo "attempt ${attempt}: api=${api} spa=${spa} jwt=${jwt}"
            if [ "$api" = "401" ] && [ "$spa" = "200" ] && { [ "$jwt" = "400" ] || [ "$jwt" = "401" ]; }; then
              echo "Deployment is healthy."
              exit 0
            fi
            sleep 10
          done
          echo "Application did not become healthy within 5 minutes."
          exit 1

      - name: Record what went live
        run: |
          echo "Wdrożone wydanie: ${{ needs.resolve-release.outputs.tag }} (${{ needs.resolve-release.outputs.sha }})" >> "$GITHUB_STEP_SUMMARY"
          echo "${APP_HEALTH_URL}" >> "$GITHUB_STEP_SUMMARY"

  # Równolegle z obrazem: APK z commita wydania, dołączony do wydania jako plik do pobrania.
  android-apk:
    name: Build Android APK
    needs: resolve-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Dołączenie pliku do wydania wymaga zapisu w repozytorium.
    permissions:
      contents: write

    steps:
      - name: Check signing secrets are available
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="${missing} ${name}"
          done
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:${missing}"
            echo "Telefon przyjmie aktualizację tylko z podpisem zainstalowanej aplikacji."
            echo "Jak je przygotować: mobile/README.md#wydanie-apk."
            exit 1
          fi
          echo "All signing secrets are present."

      - name: Checkout the released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      # Bez tego pliku APK działa jak dotąd, ale powiadomienia nie docierają przy zamkniętej aplikacji.
      - name: Add the Firebase configuration
        working-directory: mobile
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail

          if [ -z "${GOOGLE_SERVICES_JSON}" ]; then
            echo "::warning title=Brak Firebase::Sekret GOOGLE_SERVICES_JSON jest pusty, więc APK nie dostanie powiadomień przy zamkniętej aplikacji. Zobacz mobile/README.md#powiadomienia-przy-zamkniętej-aplikacji."
            echo "- Powiadomienia przy zamkniętej aplikacji: wyłączone (brak GOOGLE_SERVICES_JSON)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Sekret może być surowym JSON-em (także z odstępami na początku) albo jego base64.
          first=$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]' | cut -c1)
          if [ "$first" = '{' ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > google-services.json
          elif ! printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > google-services.json 2>/dev/null; then
            echo "::error title=Zły GOOGLE_SERVICES_JSON::Sekret nie jest ani JSON-em, ani poprawnym base64."
            exit 1
          fi

          package=$(node -p "require('./app.json').expo.android.package")
          node -e '
            const [file, name] = process.argv.slice(1);
            let config;
            try {
              config = JSON.parse(require("fs").readFileSync(file, "utf8"));
            } catch {
              console.log("::error title=Zły GOOGLE_SERVICES_JSON::To nie jest poprawny JSON. Wklej cały plik google-services.json albo jego base64.");
              process.exit(1);
            }
            if (!(config.client || []).some((client) => client.client_info?.android_client_info?.package_name === name)) {
              console.log(`::error title=Zły GOOGLE_SERVICES_JSON::google-services.json nie ma aplikacji Androida ${name}. Dodaj ją w konsoli Firebase i pobierz plik ponownie.`);
              process.exit(1);
            }
          ' google-services.json "$package"

          echo "- Powiadomienia przy zamkniętej aplikacji: włączone (Firebase)" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate the Android project
        working-directory: mobile
        env:
          EXPO_NO_TELEMETRY: 1
        run: npx expo prebuild --platform android --no-install

      - name: Build the signed APK
        id: build
        working-directory: mobile/android
        env:
          # Expo wpisuje EXPO_PUBLIC_* do kodu aplikacji podczas budowania — to adres API, z którym łączy się APK.
          EXPO_PUBLIC_API_URL: ${{ env.APP_HEALTH_URL }}
          EXPO_NO_TELEMETRY: 1
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          keystore="${RUNNER_TEMP}/release.keystore"
          certificate="${RUNNER_TEMP}/release.cer"
          log="${RUNNER_TEMP}/keytool.log"
          trap 'rm -f "$keystore" "$certificate" "$log"' EXIT
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$keystore"; then
            echo "ANDROID_KEYSTORE_BASE64 nie jest poprawnym base64 pliku keystore."
            exit 1
          fi

          # Sprawdza keystore, alias i oba hasła, zanim Gradle spędzi nad buildem kwadrans.
          # certreq potrzebuje klucza prywatnego, więc zawodzi przy złym haśle klucza.
          if ! keytool -exportcert -keystore "$keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD \
              -alias "$ANDROID_KEY_ALIAS" -file "$certificate" > "$log" 2>&1 \
            || ! keytool -certreq -keystore "$keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD \
              -alias "$ANDROID_KEY_ALIAS" -keypass:env ANDROID_KEY_PASSWORD -file /dev/null >> "$log" 2>&1; then
            grep 'keytool error' "$log" || cat "$log"
            echo "Keystore z ANDROID_KEYSTORE_BASE64 nie pasuje do hasła albo aliasu z sekretów."
            exit 1
          fi

          # Skrót certyfikatu z sekretów. Następny krok wymaga, żeby APK miał dokładnie ten podpis.
          digest=$(sha256sum "$certificate" | cut -d' ' -f1)
          echo "keystore-digest=${digest}" >> "$GITHUB_OUTPUT"

          # mobile/plugins/with-release-signing.js podpisuje wydanie kluczem z tych właściwości Gradle.
          export ORG_GRADLE_PROJECT_FAMILY_PLAN_RELEASE_STORE_FILE="$keystore"
          export ORG_GRADLE_PROJECT_FAMILY_PLAN_RELEASE_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          export ORG_GRADLE_PROJECT_FAMILY_PLAN_RELEASE_KEY_ALIAS="$ANDROID_KEY_ALIAS"
          export ORG_GRADLE_PROJECT_FAMILY_PLAN_RELEASE_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"

          # Szablon daje Gradle 2 GB pamięci; runner ma 16 GB, a brak pamięci to częsta przyczyna padających buildów.
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Check the signature and the API address
        id: apk
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ env.APP_HEALTH_URL }}
          KEYSTORE_DIGEST: ${{ steps.build.outputs.keystore-digest }}
          # Opcjonalna zmienna repozytorium: SHA-256 certyfikatu aplikacji zainstalowanej na telefonach.
          EXPECTED_DIGEST: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail

          version=$(node -p "require('./app.json').expo.version")
          code=$(node -p "require('./app.json').expo.android.versionCode")
          apk="${RUNNER_TEMP}/FamilyPlan-${version}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"

          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          signer=$("$build_tools/apksigner" verify --print-certs "$apk")
          digest=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$signer")
          owner=$(sed -n 's/^Signer #1 certificate DN: //p' <<< "$signer")

          if [ "$digest" != "$KEYSTORE_DIGEST" ]; then
            echo "APK nie ma podpisu z ANDROID_KEYSTORE_BASE64: ${digest:-brak podpisu} zamiast ${KEYSTORE_DIGEST}."
            if [ ! -f plugins/with-release-signing.js ]; then
              echo "To wydanie powstało przed plugins/with-release-signing.js, więc jego APK ma podpis klucza debug."
            fi
            exit 1
          fi

          expected=$(tr -d ': ' <<< "$EXPECTED_DIGEST" | tr 'A-F' 'a-f')
          if [ -n "$expected" ] && [ "$digest" != "$expected" ]; then
            echo "Klucz z sekretów (${digest}) nie jest kluczem zainstalowanej aplikacji (ANDROID_CERT_SHA256: ${expected})."
            echo "Telefony odrzuciłyby taki plik jako aktualizację."
            exit 1
          fi
          if [ -z "$expected" ]; then
            echo "::notice title=Podpis APK::Certyfikat SHA-256 ${digest}. Wpisz go do zmiennej ANDROID_CERT_SHA256, a kolejne wydania będą pilnować tego klucza."
          fi
          case "$owner" in
            *"CN=Android Debug"*)
              echo "::warning title=Publiczny klucz debug::APK ma podpis klucza debug z szablonu Expo, który jest publiczny. Zobacz mobile/README.md#wydanie-apk."
              ;;
          esac

          bundle="${RUNNER_TEMP}/index.android.bundle"
          unzip -p "$apk" assets/index.android.bundle > "$bundle"
          if ! grep -a -q -F "$EXPO_PUBLIC_API_URL" "$bundle"; then
            echo "Kod aplikacji w APK nie zawiera adresu ${EXPO_PUBLIC_API_URL}, więc nie połączyłby się z produkcją."
            exit 1
          fi

          {
            echo "path=${apk}"
            echo "version=${version}"
            echo "code=${code}"
            echo "digest=${digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve-release.outputs.tag }}
          APK: ${{ steps.apk.outputs.path }}
          VERSION: ${{ steps.apk.outputs.version }}
          CODE: ${{ steps.apk.outputs.code }}
          DIGEST: ${{ steps.apk.outputs.digest }}
        run: |
          set -euo pipefail

          # --clobber: ponowne uruchomienie podmienia plik o tej samej nazwie.
          gh release upload "$TAG" "$APK" --clobber

          {
            echo "### Android"
            echo "- $(basename "$APK"): wersja ${VERSION}, kod wersji ${CODE}, dołączony do wydania ${TAG}"
            echo "- API: ${APP_HEALTH_URL}"
            echo "- Certyfikat SHA-256: \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

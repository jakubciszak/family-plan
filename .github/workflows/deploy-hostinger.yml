name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  PHP_IMAGE: ghcr.io/${{ github.repository_owner }}/family-plan-php
  NGINX_IMAGE: ghcr.io/${{ github.repository_owner }}/family-plan-nginx
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/family-plan-frontend
  APP_HEALTH_URL: https://family-plan.srv1201847.hstgr.cloud

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push PHP image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/php/Dockerfile.prod
          push: true
          tags: ${{ env.PHP_IMAGE }}:latest,${{ env.PHP_IMAGE }}:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile.prod
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest,${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Nginx image
        uses: docker/build-push-action@v5
        with:
          context: ./docker/nginx
          file: docker/nginx/Dockerfile.prod
          push: true
          tags: ${{ env.NGINX_IMAGE }}:latest,${{ env.NGINX_IMAGE }}:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PHP_IMAGE=${{ env.PHP_IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Check required secrets are available
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          VPS_ID: ${{ secrets.HOSTINGER_VPS_ID }}
        run: |
          missing=""
          [ -n "${HOSTINGER_API_TOKEN}" ] || missing="${missing} HOSTINGER_API_TOKEN"
          [ -n "${VPS_ID}" ] || missing="${missing} HOSTINGER_VPS_ID"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:${missing}"
            echo "Set them under Settings > Secrets and variables > Actions > Repository secrets."
            echo "Environment-scoped secrets are not visible to this job."
            exit 1
          fi
          echo "Both secrets are present."

      - name: Trigger project update on Hostinger VPS
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          VPS_ID: ${{ secrets.HOSTINGER_VPS_ID }}
          PROJECT: family-plan-project
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST \
            "https://developers.hostinger.com/api/vps/v1/virtual-machines/${VPS_ID}/docker/${PROJECT}/update" \
            -H "Authorization: Bearer ${HOSTINGER_API_TOKEN}" \
            -H "Content-Type: application/json"

      - name: Wait for the application to come back up
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            api=$(curl -s -o /dev/null -w '%{http_code}' "${APP_HEALTH_URL}/api/auth/me" || true)
            spa=$(curl -s -o /dev/null -w '%{http_code}' "${APP_HEALTH_URL}/" || true)
            echo "attempt ${attempt}: api=${api} spa=${spa}"
            if [ "$api" = "401" ] && [ "$spa" = "200" ]; then
              echo "Deployment is healthy."
              exit 0
            fi
            sleep 10
          done
          echo "Application did not become healthy within 5 minutes."
          exit 1

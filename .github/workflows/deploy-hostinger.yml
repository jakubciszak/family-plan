name: Deploy to Hostinger

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag wydania do wdrożenia (np. v1.2.3). Puste = ostatnie opublikowane wydanie."
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  PHP_IMAGE: ghcr.io/${{ github.repository_owner }}/family-plan-php
  NGINX_IMAGE: ghcr.io/${{ github.repository_owner }}/family-plan-nginx
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/family-plan-frontend
  APP_HEALTH_URL: https://family-plan.srv1201847.hstgr.cloud

jobs:
  resolve-release:
    name: Resolve release
    runs-on: ubuntu-latest
    # Automatycznie wdrażamy tylko pełne wydania. Pre-release da się wypchnąć ręcznie
    # przez workflow_dispatch z podanym tagiem.
    if: github.event_name != 'release' || github.event.release.prerelease == false

    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Pick the release to deploy
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          tag="${EVENT_TAG:-${INPUT_TAG:-}}"
          if [ -z "$tag" ]; then
            tag=$(gh release view --json tagName --jq .tagName)
            echo "Nie podano tagu — wdrażam ostatnie wydanie: ${tag}"
          fi

          # Wdrażamy wyłącznie opublikowane wydania — nigdy szkicu ani gołej gałęzi.
          if ! state=$(gh release view "$tag" --json isDraft --jq .isDraft); then
            echo "Nie ma wydania o tagu ${tag}. Najpierw utwórz release."
            exit 1
          fi
          if [ "$state" != "false" ]; then
            echo "Wydanie ${tag} jest szkicem — opublikuj je przed wdrożeniem."
            exit 1
          fi

          sha=$(gh api "repos/${GH_REPO}/commits/${tag}" --jq .sha)

          # Tag obrazu Dockera dopuszcza tylko [A-Za-z0-9_.-] i nie zaczyna się od . ani -
          version=$(printf '%s' "$tag" | tr -c 'A-Za-z0-9_.-' '-')
          case "$version" in
            [.-]*) version="v${version}" ;;
          esac

          {
            echo "tag=${tag}"
            echo "sha=${sha}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

          echo "Wydanie ${tag} (${sha}) → obrazy z tagiem ${version}" >> "$GITHUB_STEP_SUMMARY"

  build-and-push:
    name: Build and push images
    needs: resolve-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push PHP image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/php/Dockerfile.prod
          push: true
          tags: |
            ${{ env.PHP_IMAGE }}:latest
            ${{ env.PHP_IMAGE }}:${{ needs.resolve-release.outputs.version }}
            ${{ env.PHP_IMAGE }}:${{ needs.resolve-release.outputs.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ needs.resolve-release.outputs.version }}
            ${{ env.FRONTEND_IMAGE }}:${{ needs.resolve-release.outputs.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Nginx image
        uses: docker/build-push-action@v5
        with:
          context: ./docker/nginx
          file: docker/nginx/Dockerfile.prod
          push: true
          tags: |
            ${{ env.NGINX_IMAGE }}:latest
            ${{ env.NGINX_IMAGE }}:${{ needs.resolve-release.outputs.version }}
            ${{ env.NGINX_IMAGE }}:${{ needs.resolve-release.outputs.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PHP_IMAGE=${{ env.PHP_IMAGE }}:${{ needs.resolve-release.outputs.sha }}

  deploy:
    name: Deploy ${{ needs.resolve-release.outputs.tag }}
    needs: [resolve-release, build-and-push]
    runs-on: ubuntu-latest

    steps:
      - name: Check required secrets are available
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          VPS_ID: ${{ secrets.HOSTINGER_VPS_ID }}
        run: |
          missing=""
          [ -n "${HOSTINGER_API_TOKEN}" ] || missing="${missing} HOSTINGER_API_TOKEN"
          [ -n "${VPS_ID}" ] || missing="${missing} HOSTINGER_VPS_ID"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:${missing}"
            echo "Set them under Settings > Secrets and variables > Actions > Repository secrets."
            echo "Environment-scoped secrets are not visible to this job."
            exit 1
          fi
          echo "Both secrets are present."

      - name: Trigger project update on Hostinger VPS
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          VPS_ID: ${{ secrets.HOSTINGER_VPS_ID }}
          PROJECT: family-plan-project
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST \
            "https://developers.hostinger.com/api/vps/v1/virtual-machines/${VPS_ID}/docker/${PROJECT}/update" \
            -H "Authorization: Bearer ${HOSTINGER_API_TOKEN}" \
            -H "Content-Type: application/json"

      - name: Wait for the application to come back up
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            api=$(curl -s -o /dev/null -w '%{http_code}' "${APP_HEALTH_URL}/api/auth/me" || true)
            spa=$(curl -s -o /dev/null -w '%{http_code}' "${APP_HEALTH_URL}/" || true)
            echo "attempt ${attempt}: api=${api} spa=${spa}"
            if [ "$api" = "401" ] && [ "$spa" = "200" ]; then
              echo "Deployment is healthy."
              exit 0
            fi
            sleep 10
          done
          echo "Application did not become healthy within 5 minutes."
          exit 1

      - name: Record what went live
        run: |
          echo "Wdrożone wydanie: ${{ needs.resolve-release.outputs.tag }} (${{ needs.resolve-release.outputs.sha }})" >> "$GITHUB_STEP_SUMMARY"
          echo "${APP_HEALTH_URL}" >> "$GITHUB_STEP_SUMMARY"

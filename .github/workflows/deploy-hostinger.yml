name: Deploy to Hostinger

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag wydania do wdrożenia (np. v1.2.3). Puste = ostatnie opublikowane wydanie."
        required: false
        type: string
      skip_checks:
        description: "Wdroż mimo braku zielonych testów (rollback starego wydania, gdy przepadły logi runów)."
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/family-plan-app
  APP_HEALTH_URL: https://family-plan.srv1201847.hstgr.cloud
  # Workflowy, które muszą być zielone na commicie wydania, zanim cokolwiek pójdzie na produkcję.
  # Nazwy z pola `name:` w .github/workflows/*.yml.
  REQUIRED_CHECKS: |
    PHPUnit Tests
    Playwright Tests
    Mobile App Tests
  CHECKS_TIMEOUT_MINUTES: "60"

jobs:
  resolve-release:
    name: Resolve release
    runs-on: ubuntu-latest
    # Automatycznie wdrażamy tylko pełne wydania. Pre-release da się wypchnąć ręcznie
    # przez workflow_dispatch z podanym tagiem.
    if: github.event_name != 'release' || github.event.release.prerelease == false

    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Pick the release to deploy
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          tag="${EVENT_TAG:-${INPUT_TAG:-}}"
          if [ -z "$tag" ]; then
            tag=$(gh release view --json tagName --jq .tagName)
            echo "Nie podano tagu — wdrażam ostatnie wydanie: ${tag}"
          fi

          # Wdrażamy wyłącznie opublikowane wydania — nigdy szkicu ani gołej gałęzi.
          if ! state=$(gh release view "$tag" --json isDraft --jq .isDraft); then
            echo "Nie ma wydania o tagu ${tag}. Najpierw utwórz release."
            exit 1
          fi
          if [ "$state" != "false" ]; then
            echo "Wydanie ${tag} jest szkicem — opublikuj je przed wdrożeniem."
            exit 1
          fi

          sha=$(gh api "repos/${GH_REPO}/commits/${tag}" --jq .sha)

          # Tag obrazu Dockera dopuszcza tylko [A-Za-z0-9_.-] i nie zaczyna się od . ani -
          version=$(printf '%s' "$tag" | tr -c 'A-Za-z0-9_.-' '-')
          case "$version" in
            [.-]*) version="v${version}" ;;
          esac

          {
            echo "tag=${tag}"
            echo "sha=${sha}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

          echo "Wydanie ${tag} (${sha}) → obrazy z tagiem ${version}" >> "$GITHUB_STEP_SUMMARY"

      - name: Require green checks on the released commit
        if: ${{ !inputs.skip_checks }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.release.outputs.sha }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          required=()
          while IFS= read -r name; do
            if [ -n "$name" ]; then
              required+=("$name")
            fi
          done <<< "${REQUIRED_CHECKS}"

          deadline=$(( $(date +%s) + CHECKS_TIMEOUT_MINUTES * 60 ))
          runs=$(mktemp)

          while :; do
            gh api "repos/${GH_REPO}/actions/runs?head_sha=${SHA}&per_page=100" > "$runs"

            pending=()
            failed=()
            for name in "${required[@]}"; do
              entry=$(jq -r --arg n "$name" '
                [.workflow_runs[] | select(.name == $n)]
                | sort_by(.run_started_at) | last // empty
                | "\(.status)|\(.conclusion // "")|\(.html_url)"' "$runs")

              if [ -z "$entry" ]; then
                pending+=("${name}: brak runu na tym commicie")
                continue
              fi

              status=${entry%%|*}
              rest=${entry#*|}
              conclusion=${rest%%|*}
              url=${rest#*|}

              if [ "$status" != "completed" ]; then
                pending+=("${name}: ${status}")
              elif [ "$conclusion" = "success" ]; then
                echo "✓ ${name}"
              else
                failed+=("${name}: ${conclusion} — ${url}")
              fi
            done

            if [ ${#failed[@]} -gt 0 ]; then
              echo "Testy na commicie wydania ${TAG} (${SHA}) nie są zielone:"
              printf '  - %s\n' "${failed[@]}"
              {
                echo "### Deployment zatrzymany — czerwone testy"
                printf '%s\n' "${failed[@]/#/- }"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            if [ ${#pending[@]} -eq 0 ]; then
              echo "Wszystkie wymagane testy przeszły na ${SHA}."
              exit 0
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Po ${CHECKS_TIMEOUT_MINUTES} min nadal czekam na:"
              printf '  - %s\n' "${pending[@]}"
              {
                echo "### Deployment zatrzymany — testy nie skończyły się w czasie"
                printf '%s\n' "${pending[@]/#/- }"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            echo "Czekam na: ${pending[*]}"
            sleep 30
          done

      - name: Note the skipped gate
        if: ${{ inputs.skip_checks }}
        run: |
          echo "⚠️ Bramka testów pominięta ręcznie (skip_checks) dla ${{ steps.release.outputs.tag }}." \
            >> "$GITHUB_STEP_SUMMARY"

  build-and-push:
    name: Build and push image
    needs: resolve-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push application image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frankenphp/Dockerfile.prod
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:latest
            ${{ env.APP_IMAGE }}:${{ needs.resolve-release.outputs.version }}
            ${{ env.APP_IMAGE }}:${{ needs.resolve-release.outputs.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy ${{ needs.resolve-release.outputs.tag }}
    needs: [resolve-release, build-and-push]
    runs-on: ubuntu-latest

    steps:
      - name: Check required secrets are available
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          VPS_ID: ${{ secrets.HOSTINGER_VPS_ID }}
        run: |
          missing=""
          [ -n "${HOSTINGER_API_TOKEN}" ] || missing="${missing} HOSTINGER_API_TOKEN"
          [ -n "${VPS_ID}" ] || missing="${missing} HOSTINGER_VPS_ID"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:${missing}"
            echo "Set them under Settings > Secrets and variables > Actions > Repository secrets."
            echo "Environment-scoped secrets are not visible to this job."
            exit 1
          fi
          echo "Both secrets are present."

      - name: Trigger project update on Hostinger VPS
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          VPS_ID: ${{ secrets.HOSTINGER_VPS_ID }}
          PROJECT: family-plan-project
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST \
            "https://developers.hostinger.com/api/vps/v1/virtual-machines/${VPS_ID}/docker/${PROJECT}/update" \
            -H "Authorization: Bearer ${HOSTINGER_API_TOKEN}" \
            -H "Content-Type: application/json"

      - name: Wait for the application to come back up
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            api=$(curl -s -o /dev/null -w '%{http_code}' "${APP_HEALTH_URL}/api/auth/me" || true)
            spa=$(curl -s -o /dev/null -w '%{http_code}' "${APP_HEALTH_URL}/" || true)
            echo "attempt ${attempt}: api=${api} spa=${spa}"
            if [ "$api" = "401" ] && [ "$spa" = "200" ]; then
              echo "Deployment is healthy."
              exit 0
            fi
            sleep 10
          done
          echo "Application did not become healthy within 5 minutes."
          exit 1

      - name: Record what went live
        run: |
          echo "Wdrożone wydanie: ${{ needs.resolve-release.outputs.tag }} (${{ needs.resolve-release.outputs.sha }})" >> "$GITHUB_STEP_SUMMARY"
          echo "${APP_HEALTH_URL}" >> "$GITHUB_STEP_SUMMARY"

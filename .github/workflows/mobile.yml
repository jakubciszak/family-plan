name: Mobile App Tests

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read

jobs:
  mobile-tests:
    name: React Native Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: mobile-tests
          POSTGRES_DB: mobile_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d mobile_api_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, intl, mbstring, gd
          coverage: none
      - run: composer install --prefer-dist --no-progress --ignore-platform-req=ext-redis
        working-directory: .
      - run: npm run e2e:real
        env:
          DATABASE_URL: postgresql://app:mobile-tests@127.0.0.1:5432/mobile_api?serverVersion=16&charset=utf8
      - run: npx expo export --platform all
      # Podpis APK w wydaniu zależy od tego pluginu; zmiana szablonu Expo ma wyjść tutaj, nie przy wydaniu.
      - name: Check release signing in the generated Android project
        run: |
          npx expo prebuild --platform android --no-install
          grep -q "project.hasProperty('FAMILY_PLAN_RELEASE_STORE_FILE')" android/app/build.gradle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-test-results
          path: |
            mobile/playwright-report/
            mobile/test-results/
            mobile/test-results-real/
          retention-days: 14

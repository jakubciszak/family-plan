services:
###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

  app:
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile
    working_dir: /app
    environment:
      APP_ENV: ${APP_ENV:-dev}
      SERVER_NAME: ":80"
      FRANKENPHP_NUM_WORKERS: ${FRANKENPHP_NUM_WORKERS:-2}
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/app
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      database:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile
    working_dir: /app
    environment:
      APP_ENV: ${APP_ENV:-dev}
      RUN_MIGRATIONS: "false"
      TZ: ${TZ:-Europe/Warsaw}
    command: ["php", "bin/console", "messenger:consume", "async", "-vv"]
    volumes:
      - ./:/app
    depends_on:
      database:
        condition: service_healthy

  timetable-sync:
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile
    working_dir: /app
    environment:
      APP_ENV: ${APP_ENV:-dev}
      RUN_MIGRATIONS: "false"
      TZ: ${TZ:-Europe/Warsaw}
      SCHOOL_TIMETABLE_SYNC_INTERVAL: ${SCHOOL_TIMETABLE_SYNC_INTERVAL:-3600}
      SCHOOL_TIMETABLE_SYNC_WEEKS: ${SCHOOL_TIMETABLE_SYNC_WEEKS:-2}
    command: ["/bin/sh", "/app/docker/frankenphp/school-timetable-sync.sh"]
    volumes:
      - ./:/app
    depends_on:
      database:
        condition: service_healthy

  # Frontend React Application (Standalone)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "1"
      WATCHPACK_POLLING: "true"
      FAST_REFRESH: "true"
      API_URL: "http://app:80"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - app

  node:
    image: node:20-alpine
    working_dir: /app
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "1"
    command: sh -c "npm install && npm run watch"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules

  react-dev:
    image: node:20-alpine
    working_dir: /app
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "1"
      FAST_REFRESH: "true"
    command: sh -c "npm install && npm run watch"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "${REACT_DEV_PORT:-3001}:3000"

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
  node_modules:
  frontend_node_modules:
  caddy_data:
  caddy_config:
